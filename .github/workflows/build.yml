name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "found: $APK"
          cp "$APK" out/HonorLocalOTA.apk
          ls -l out
          echo '--- verify xposed metadata in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'META-INF/xposed' || { echo 'MISSING XPOSED META'; exit 1; }
          echo '--- verify launcher activity in apk ---'
          unzip -p out/HonorLocalOTA.apk AndroidManifest.xml > /dev/null && echo 'manifest present'
          echo '--- verify license in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'LICENSE' || { echo 'MISSING LICENSE'; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorLocalOTA-apk
          path: out/HonorLocalOTA.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/HonorLocalOTA.apk \
            --title "HonorLocalOTA ${TAG}" \
            --notes "Automated build from ${GITHUB_SHA}"
