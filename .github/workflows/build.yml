name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect artifact
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "found: $APK"
          cp "$APK" out/HonorLocalOTA.apk
          ls -l out
          echo '--- verify xposed metadata in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'META-INF/xposed' || { echo 'MISSING XPOSED META'; exit 1; }
          echo '--- verify launcher activity in apk ---'
          unzip -p out/HonorLocalOTA.apk AndroidManifest.xml > /dev/null && echo 'manifest present'
          echo '--- verify license in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'LICENSE' || { echo 'MISSING LICENSE'; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorLocalOTA-apk
          path: out/HonorLocalOTA.apk
          if-no-files-found: error

      # tag 一律取 APK 里真实的 versionCode-versionName，
      # 与 Xposed-Modules-Repo 的 Release Tag 规则保持一致，
      # 不再使用 build-${run_number}，避免两套编号脱节。
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VC=""
          VN=""
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "${AAPT:-}" ]; then
            BADGING=$("$AAPT" dump badging out/HonorLocalOTA.apk 2>/dev/null | head -1 || true)
            VC=$(printf '%s' "${BADGING:-}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            VN=$(printf '%s' "${BADGING:-}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          fi
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo 'aapt2 unavailable -> fallback to app/build.gradle.kts'
            VC=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' app/build.gradle.kts | head -1)
            VN=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          fi
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo 'cannot resolve versionCode/versionName from apk or gradle file'
            exit 1
          fi
          echo "versionCode = $VC"
          echo "versionName = $VN"
          echo "tag         = ${VC}-${VN}"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=${VC}-${VN}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VN: ${{ steps.ver.outputs.vn }}
          VC: ${{ steps.ver.outputs.vc }}
        run: |
          set -euo pipefail
          ASSET="HonorLocalOTA-${VN}.apk"
          cp out/HonorLocalOTA.apk "out/$ASSET"
          NOTES=$(printf 'Automated build from %s\n\nversionCode %s / versionName %s' "$GITHUB_SHA" "$VC" "$VN")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists -> replace asset"
            gh release upload "$TAG" "out/$ASSET" --clobber
            gh release edit "$TAG" --title "$VN" --notes "$NOTES"
          else
            gh release create "$TAG" "out/$ASSET" --title "$VN" --notes "$NOTES"
          fi
