name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
env:
  # 期望的签名证书 SHA-256（固定签名，改动即报警）。留空则跳过校验。
  EXPECTED_CERT_SHA256: '4B:ED:77:F9:6F:27:28:16:81:D1:A0:09:15:82:64:B9:51:DD:A6:7D:CE:4E:98:09:A0:43:54:39:F3:00:6F:86'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 固定签名：从 secrets 还原 keystore 到 runner。
      # 缺 secret 直接失败——绝不退回 debug 签名，否则产物无法覆盖升级。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo 'ERROR: 缺少 KEYSTORE_BASE64 / KEYSTORE_PASSWORD secret'
            echo '没有固定签名会生成一次性 debug 密钥，产物无法覆盖升级。'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          KS="$RUNNER_TEMP/keys/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          echo "keystore 大小: $(stat -c%s "$KS") B"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect artifact
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "found: $APK"
          cp "$APK" out/HonorLocalOTA.apk
          ls -l out
          echo '--- verify xposed metadata in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'META-INF/xposed' || { echo 'MISSING XPOSED META'; exit 1; }
          echo '--- verify launcher activity in apk ---'
          unzip -p out/HonorLocalOTA.apk AndroidManifest.xml > /dev/null && echo 'manifest present'
          echo '--- verify license in apk ---'
          unzip -l out/HonorLocalOTA.apk | grep -i 'LICENSE' || { echo 'MISSING LICENSE'; exit 1; }

      # 校验实际签名证书，防止悄悄退回 debug 签名导致用户无法覆盖升级。
      - name: Verify signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          echo "build-tools: $BT"
          APKSIGNER="$BT/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo 'ERROR: 找不到 apksigner'
            exit 1
          fi
          OUT=$("$APKSIGNER" verify --print-certs out/HonorLocalOTA.apk)
          echo "$OUT"
          # 注意：apksigner 输出的是 "V2 Signer: certificate SHA-256 digest: <hex>"（小写无冒号），
          # 不是 "Signer #1 certificate SHA-256 digest:"，两种写法都兼容。
          CERT=$(printf '%s\n' "$OUT" \
                 | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1)
          CERT=$(printf '%s' "$CERT" | tr 'a-f' 'A-F')
          echo "实际证书 SHA-256: $CERT"
          if [ -z "$CERT" ]; then
            echo 'ERROR: 无法解析签名证书指纹'
            exit 1
          fi
          WANT=$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr -d ':' | tr 'a-f' 'A-F')
          if [ -n "$WANT" ] && [ "$CERT" != "$WANT" ]; then
            echo 'ERROR: 签名证书与预期不一致，产物无法覆盖升级'
            echo "  预期: $WANT"
            echo "  实际: $CERT"
            exit 1
          fi
          echo '签名校验通过'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorLocalOTA-apk
          path: out/HonorLocalOTA.apk
          if-no-files-found: error

      # tag 一律取 APK 里真实的 versionCode-versionName，
      # 与 Xposed-Modules-Repo 的 Release Tag 规则保持一致，
      # 不再使用 build-${run_number}，避免两套编号脱节。
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VC=""
          VN=""
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1 || true)
          if [ -x "$BT/aapt2" ]; then
            BADGING=$("$BT/aapt2" dump badging out/HonorLocalOTA.apk 2>/dev/null | head -1 || true)
            VC=$(printf '%s' "${BADGING:-}" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            VN=$(printf '%s' "${BADGING:-}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          fi
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo 'aapt2 不可用 -> 回退解析 app/build.gradle.kts'
            VC=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' app/build.gradle.kts | head -1)
            VN=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          fi
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo 'cannot resolve versionCode/versionName'
            exit 1
          fi
          echo "versionCode = $VC"
          echo "versionName = $VN"
          echo "tag         = ${VC}-${VN}"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=${VC}-${VN}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VN: ${{ steps.ver.outputs.vn }}
          VC: ${{ steps.ver.outputs.vc }}
        run: |
          set -euo pipefail
          ASSET="HonorLocalOTA-${VN}.apk"
          cp out/HonorLocalOTA.apk "out/$ASSET"
          NOTES=$(printf 'Automated build from %s\n\nversionCode %s / versionName %s' "$GITHUB_SHA" "$VC" "$VN")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在 -> 覆盖资产"
            gh release upload "$TAG" "out/$ASSET" --clobber
            gh release edit "$TAG" --title "$VN" --notes "$NOTES"
          else
            gh release create "$TAG" "out/$ASSET" --title "$VN" --notes "$NOTES"
          fi

      # LSPosed 管理器只读模块仓库的 Release，源码仓库的 Release 它不看。
      # 所以必须把同一个 APK 再发到 Xposed-Modules-Repo/io.github.oopnv70_lab.app，
      # 否则用户装了模块也永远收不到更新。
      # tag 规则必须与模块仓库一致：{versionCode}-{versionName}。
      - name: Publish to LSPosed module repo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VN: ${{ steps.ver.outputs.vn }}
          VC: ${{ steps.ver.outputs.vc }}
        run: |
          set -euo pipefail
          MODULE_REPO="Xposed-Modules-Repo/io.github.oopnv70_lab.app"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'ERROR: 缺少 MODULE_REPO_TOKEN secret，无法发布到模块仓库'
            echo 'LSPosed 管理器只读模块仓库，不发布等于用户收不到更新。'
            exit 1
          fi
          ASSET="HonorLocalOTA-${VN}.apk"
          cp out/HonorLocalOTA.apk "out/$ASSET"
          NOTES=$(printf 'Automated build from %s\n\nversionCode %s / versionName %s' "$GITHUB_SHA" "$VC" "$VN")
          if gh release view "$TAG" -R "$MODULE_REPO" >/dev/null 2>&1; then
            echo "模块仓库已有 $TAG -> 覆盖资产"
            gh release upload "$TAG" "out/$ASSET" -R "$MODULE_REPO" --clobber
            gh release edit "$TAG" -R "$MODULE_REPO" --title "$VN" --notes "$NOTES"
          else
            gh release create "$TAG" "out/$ASSET" -R "$MODULE_REPO" --title "$VN" --notes "$NOTES"
          fi
          echo '已发布到模块仓库:' "https://github.com/$MODULE_REPO/releases/tag/$TAG"